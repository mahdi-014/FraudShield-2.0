services:
  postgres:
    image: postgres:16-alpine
    container_name: fraudshield-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fraudshield
      POSTGRES_PASSWORD: fraudshield_password
      POSTGRES_DB: fraudshield_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraudshield -d fraudshield_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
